---

- name: Converge
  hosts: all
  become: "yes"
  vars:
    molecule_driver: "{{ lookup('env', 'MOLECULE_DRIVER_NAME') }}"
    cicd_python_venv_install: True
    cicd_python_venv_list: ['yq', 'e2j2']
  tasks:
    - name: Include role 'ansible-role-cicd'
      ansible.builtin.include_role:
        name: ansible-role-cicd
