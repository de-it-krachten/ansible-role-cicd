---

- name: Install requirements
  ansible.builtin.package:
    name: "{{ cicd_dependency_packages }}"
    state: present

- name: Install RPM on RedHat family
  when: ansible_facts.os_family == 'RedHat'
  block:

    - name: Download RPM package
      ansible.builtin.get_url:
        url: "{{ cicd_repo }}/releases/download/{{ cicd_version }}/{{ cicd_package_rpm }}"
        dest: "/tmp/{{ cicd_package_rpm }}"
        mode: "0644"

    - name: Install package using DNF
      ansible.builtin.dnf:
        name: /tmp/{{ cicd_package_rpm }}
        state: present

- name: Install DEB on Debian family
  when: ansible_facts.os_family == 'Debian'
  block:

    - name: Download APT package
      ansible.builtin.get_url:
        url: "{{ cicd_repo }}/releases/download/{{ cicd_version }}/{{ cicd_package_deb }}"
        dest: "/tmp/{{ cicd_package_deb }}"
        mode: "0644"

    - name: Install package using APT
      ansible.builtin.apt:
        deb: "/tmp/{{ cicd_package_deb }}"
        state: present
